[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pidkit"
version = "0.2.0"
description = "A minimal, dependency-free PID controller for Python."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/pidkit"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
